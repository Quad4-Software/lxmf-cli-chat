version: '3'

tasks:
  test:
    desc: Run all tests
    cmds:
      - poetry run pytest

  dev:
    desc: Run the application in debug mode
    cmds:
      - poetry run lxmf-chat --debug

  build:
    desc: Build the package
    cmds:
      - poetry build

  lint:
    desc: Run linting
    cmds:
      - poetry run ruff check .

  format:
    desc: Format code
    cmds:
      - poetry run ruff format .

