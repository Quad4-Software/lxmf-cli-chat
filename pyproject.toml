[project]
name = "lxmf-cli-chat"
version = "1.0.0"
description = "LXMF CLI Chat - Basic TUI Chat Client"
authors = [
    { name = "Ivan" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxmf>=0.9.4,<0.10.0",
    "rns>=1.1.3,<2.0.0",
    "cryptography==46.0.5"
]

[project.scripts]
lxmf-chat = "lxmf_cli_chat.main:main"

[tool.poetry]
packages = [{include = "lxmf_cli_chat", from = "src"}]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "hypothesis (>=6.150.2,<7.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "atheris (>=3.0.0,<4.0.0)",
    "psutil (>=7.2.1,<8.0.0)",
    "ruff (>=0.14.11,<0.15.0)"
]
